[project]
name = "UnlockerX"
version = "2.0.0"
description = "Near unlock your Mac by Bluetooth device"
requires-python = ">=3.12"
authors = [{ name = "HsOjo" }]
readme = "README.md"
license = { text = "MIT" }
keywords = ["macos", "bluetooth", "unlock", "menu-bar"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "requests",
    "pyobjc-framework-Cocoa",
    "pyobjc-framework-IOBluetooth",
    "pyobjc-framework-Quartz",
]

[project.optional-dependencies]
build = ["PyInstaller"]

[project.urls]
Homepage = "https://github.com/HsOjo/UnlockerX"
Repository = "https://github.com/HsOjo/UnlockerX"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "functional: tests that exercise real macOS Bluetooth / system_profiler stack",
]
